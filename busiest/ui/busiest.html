<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8" />
	<link rel="stylesheet" href="../inspectors/css/sdpi.css" />
	<link rel="stylesheet" href="../inspectors/css/stylesheet.css" />
</head>
<body>
	<div class="sdpi-wrapper">
		<div class="sdpi-item creds">
			<div class="sdpi-item-label">Client ID</div>
			<input class="sdpi-item-value" id="clientId" type="text" placeholder="Discord application ID" />
		</div>
		<div class="sdpi-item creds">
			<div class="sdpi-item-label">Client Secret</div>
			<input class="sdpi-item-value" id="clientSecret" type="password" placeholder="unchanged" />
		</div>

		<div class="sdpi-item">
			<div class="sdpi-item-label">Server</div>
			<select class="sdpi-item-value select" id="guild">
				<option value="">Server of current or last call</option>
			</select>
		</div>
		<div class="sdpi-item">
			<div class="sdpi-item-label empty"></div>
			<button class="sdpi-item-value" id="refresh">Reload Servers</button>
		</div>
		<div class="sdpi-item">
			<div class="sdpi-item-label">Status</div>
			<div class="sdpi-item-value" id="status" style="padding-top:4px;"></div>
		</div>

		<details class="sdpi-item creds">
			<summary>Setup</summary>
			<p class="sdpi-item-value" style="padding:6px 0;">
				Create an app at discord.com/developers/applications, add the OAuth2 redirect
				http://localhost, then paste its Client ID and Secret here. The first time the server
				list loads (or you press the key), Discord asks you to authorize the app.
			</p>
		</details>
	</div>

	<script>
		let ws, uuid, action, settings = {}, hasSecret = false;
		const $ = (id) => document.getElementById(id);

		function connectElgatoStreamDeckSocket(port, inUUID, registerEvent, info, actionInfo) {
			uuid = inUUID;
			try { const a = JSON.parse(actionInfo); action = a.action; settings = a.payload.settings || {}; } catch { settings = {}; }
			ws = new WebSocket('ws://127.0.0.1:' + port);
			ws.onopen = () => {
				ws.send(JSON.stringify({ event: registerEvent, uuid: inUUID }));
				applyToUi();
				toPlugin({ cmd: 'status' });
			};
			ws.onmessage = (e) => {
				let m; try { m = JSON.parse(e.data); } catch { return; }
				if (m.event === 'didReceiveSettings') { settings = (m.payload && m.payload.settings) || {}; applyToUi(); }
				if (m.event === 'sendToPropertyInspector') onPlugin(m.payload || {});
			};
		}
		window.connectElgatoStreamDeckSocket = connectElgatoStreamDeckSocket;

		const toPlugin = (payload) => { if (ws && ws.readyState === 1) ws.send(JSON.stringify({ event: 'sendToPlugin', action, context: uuid, payload })); };
		const save = () => { if (ws && ws.readyState === 1) ws.send(JSON.stringify({ event: 'setSettings', context: uuid, payload: settings })); };

		function onPlugin(p) {
			if (p.status != null) $('status').textContent = p.status;
			if (p.bundled) document.querySelectorAll('.creds').forEach((el) => { el.style.display = 'none'; });
			if (p.clientId != null) { $('clientId').value = p.clientId; hasSecret = p.hasSecret; $('clientSecret').placeholder = hasSecret ? 'saved' : 'Discord client secret'; }
			// The status reply comes once per open: fill the server list right away if the app is set up.
			if (p.bundled != null && (p.bundled || (p.clientId && p.hasSecret))) loadGuilds();
			if (p.guilds) {
				const sel = $('guild');
				sel.length = 1;
				for (const g of p.guilds) sel.add(new Option(g.name, g.id));
				sel.value = settings.guildId || '';
			}
		}

		function applyToUi() {
			const sel = $('guild');
			// Keep the saved server visible before the list is loaded.
			if (settings.guildId && ![...sel.options].some((o) => o.value === settings.guildId)) sel.add(new Option(settings.guildName || settings.guildId, settings.guildId));
			sel.value = settings.guildId || '';
		}

		function sendCreds() {
			const clientId = $('clientId').value.trim(), clientSecret = $('clientSecret').value.trim();
			if (!clientId || !clientSecret) return; // both are needed; a saved secret is kept until a new one is typed
			toPlugin({ cmd: 'creds', clientId, clientSecret });
			loadGuilds();
			hasSecret = true;
			$('clientSecret').value = '';
			$('clientSecret').placeholder = 'saved';
		}

		$('clientId').addEventListener('change', sendCreds);
		$('clientSecret').addEventListener('change', sendCreds);
		function loadGuilds() { $('status').textContent = 'Connecting… (check Discord for an Authorize popup)'; toPlugin({ cmd: 'guilds' }); }
		$('refresh').addEventListener('click', loadGuilds);
		$('guild').addEventListener('change', () => {
			const o = $('guild').selectedOptions[0];
			settings.guildId = o.value;
			settings.guildName = o.value ? o.text : '';
			save();
		});
	</script>
</body>
</html>
